apiVersion: apps/v1
kind: Deployment
metadata:
  name: churnsim
spec:
  # Deliberately the SAME deployment name, labels and rolling-update shape as k8s/churnsim.yaml.
  # The two arms are mutually exclusive -- one cluster under test at a time -- and keeping the
  # names identical means every script's `deployment/churnsim` and `-l app=churnsim` selector
  # works unchanged on both. Diff this file against churnsim.yaml: everything except the
  # backend-specific env block should be identical, and if it is not, the arms are not comparable.
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 15
  selector:
    matchLabels:
      app: churnsim
  template:
    metadata:
      labels:
        app: churnsim
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: churnsim
          image: localhost/churnsim:local
          imagePullPolicy: Never
          env:
            # Declares which arm this is. ChurnSim compares it against the backend the image was
            # BUILT for and refuses to start on a mismatch, so a stale image cannot quietly
            # produce numbers filed under the wrong store.
            - name: SIM_BACKEND
              value: "ravendb"
            # Structured stdout, always (src/ChurnSim/Program.cs); everything downstream reads it.
            - name: SIM_JSON_LOGS
              value: "true"
            - name: RAVENDB_URLS
              value: "http://ravendb:8080"
            - name: RAVENDB_DATABASE
              value: "churnsim"
            # Downward API. On the PostgreSQL arm POD_IP is what joins a pg_stat_activity backend
            # back to a node; RavenDB's lock names its owner outright and needs no such join, but
            # both are still logged because SIM-IDENTITY is what gives S6/S7 their node-to-pod map
            # on either backend.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: SIM_AGENT_COUNT
              value: "500"
            - name: SIM_AGENT_MB
              value: "0"
            - name: SIM_START_DELAY_MS
              value: "500"
            # ROLLOUT_STAMP is bumped by scripts/rollout.sh to force a new
            # pod template hash => a genuine rolling deploy with no code change
            - name: ROLLOUT_STAMP
              value: "initial"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              # The overload runs' kill line: .NET's default GC heap hard limit is
              # 75% of this (384Mi), which is what the default load monitor measures
              # WorkingSet against — so ~380Mi resident is where allocations fail
              memory: 512Mi
