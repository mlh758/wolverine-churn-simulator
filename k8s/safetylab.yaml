apiVersion: apps/v1
kind: Deployment
metadata:
  name: safetylab
spec:
  # Exactly one. A second monitor would double the history with interleaved seq numbers and
  # make the coverage check meaningless.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: safetylab
  template:
    metadata:
      labels:
        app: safetylab
    spec:
      # The monitor must outlive a rollout of the app it is watching, and must not be drained
      # at the same moment the interesting thing happens.
      terminationGracePeriodSeconds: 5
      containers:
        - name: safetylab
          image: localhost/safetylab:local
          imagePullPolicy: Never
          args: ["monitor", "--tick-ms", "200", "--schema", "wolverine"]
          env:
            - name: POSTGRES_CONNECTION
              # Its own connection, and a small pool: the monitor must never be the reason
              # the app cannot get one.
              value: "Host=pg;Database=churnsim;Username=postgres;Password=postgres;Maximum Pool Size=2;Application Name=safetylab"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
