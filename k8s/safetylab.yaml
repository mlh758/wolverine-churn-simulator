apiVersion: apps/v1
kind: Deployment
metadata:
  name: safetylab
spec:
  # Exactly one. A second monitor would double the history with interleaved seq numbers and
  # make the coverage check meaningless.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: safetylab
  template:
    metadata:
      labels:
        app: safetylab
    spec:
      # The monitor must outlive a rollout of the app it is watching, and must not be drained
      # at the same moment the interesting thing happens.
      terminationGracePeriodSeconds: 5
      containers:
        - name: safetylab
          image: localhost/safetylab:local
          imagePullPolicy: Never
          # 1s, not something faster. Every sample carries the whole assignment table, so at 500
          # agents a sample is ~65 KB and a 200ms tick writes ~200 MB for a ten-minute run --
          # with no added resolution, since the control plane itself only ticks at 2-5s and the
          # checkers' grace windows are 15s. Drop this for small-agent-count runs where you want
          # to catch a fast handover.
          args: ["monitor", "--tick-ms", "1000", "--schema", "wolverine"]
          env:
            - name: POSTGRES_CONNECTION
              # Its own connection, and a small pool: the monitor must never be the reason
              # the app cannot get one.
              value: "Host=pg;Database=churnsim;Username=postgres;Password=postgres;Maximum Pool Size=2;Application Name=safetylab"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
